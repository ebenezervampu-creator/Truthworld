# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

include: package:very_good_analysis/analysis_options.yaml

linter:
  rules:
    # Temporarily relaxed while migrating (remove one at a time):
    avoid_print: false              # Phase 8 will remove all prints
    public_member_api_docs: false   # Enable after Phase 12
    lines_longer_than_80_chars: false  # Enable selectively after Phase 4
    sort_pub_dependencies: false    # Not critical
    flutter_style_todos: false      # Existing TODOs don't follow this
    comment_references: false       # Too many false positives during migration

analyzer:
  errors:
    dead_code: warning
    unused_import: warning
    unused_local_variable: warning
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"
    - ".dart_tool/**"
