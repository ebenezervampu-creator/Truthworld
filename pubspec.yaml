name: truthworld
description: "TruthWorld - AI-powered fact-checking, 70+ languages dubbing, and 100% creator revenue video platform."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.1+20

environment:
  sdk: ^3.11.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  firebase_auth_platform_interface: ^9.0.5
  firebase_database: ^12.1.4
  cloud_firestore: ^6.7.1
  cloud_functions: ^6.3.5
  firebase_storage: ^13.4.5
  firebase_messaging: ^16.4.3
  firebase_app_check: ^0.4.5+2

  # State Management
  get: ^4.7.2
  collection: ^1.18.0

  # UI & Media
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  timeago: ^3.7.1
  chewie: ^1.12.1
  video_player: ^2.10.0
  google_fonts: ^8.2.0
  flutter_staggered_grid_view: ^0.7.0
  percent_indicator: ^4.2.5

  # File & Media Handling
  file_picker: ^12.0.0-beta.7
  image_picker: ^1.2.0
  image_cropper: ^12.2.1
  ffmpeg_kit_flutter_new: ^4.6.2

  # Platform & Utilities
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.1
  intl: ^0.20.2
  permission_handler: ^12.0.1
  url_launcher: ^6.3.2
  share_plus: ^13.3.0
  idb_shim: ^2.6.7
  path_provider: ^2.1.5
  path: ^1.9.0

  # Auth & Search
  speech_to_text: ^7.3.0
  typesense: ^0.6.0

  # Charts & Visualization
  syncfusion_flutter_charts: ^34.1.32

  # Text Safety
  multi_lang_bad_words_filter: ^0.0.3
  profanity_filter: ^2.0.0
  uuid: ^4.5.1
  crypto: ^3.0.6
  pointycastle: ^3.9.1

  flutter_video_info: ^1.3.3
  web: ^1.1.1
  get_storage: ^2.1.1
  google_sign_in: ^7.2.0
  firebase_analytics: ^12.4.5
  http: ^1.6.0
  connectivity_plus: ^7.1.0
  visibility_detector: ^0.4.0+2
  flutter_animate: ^4.5.2
  just_audio: ^0.10.6

  # Crash reporting & performance monitoring
  firebase_crashlytics: ^5.2.6

  # Payment Gateway
  flutter_cashfree_pg_sdk: ^2.4.0+52

  flutter_web_plugins:
    sdk: flutter
  app_links: ^7.2.1
  lottie: ^3.6.1
  local_auth: ^3.0.2
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_secure_storage: ^11.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  # integration_test is only needed for on-device instrumentation tests and causes javac error in release builds
  # integration_test:
  #   sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  very_good_analysis: ^10.3.0
  mocktail: ^1.0.4
  video_player_platform_interface: ^6.2.0

  firebase_core_platform_interface: any
dependency_overrides:
  get_storage:
    path: packages/get_storage
  flutter_cashfree_pg_sdk:
    path: packages/flutter_cashfree_pg_sdk

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/cropper/
    - assets/fonts/
    - assets/icons/
    - assets/lottie/

  fonts:
    - family: TruthWorld Sans
      fonts:
        - asset: assets/fonts/TruthWorldSans-Regular.ttf
        - asset: assets/fonts/TruthWorldSans-Bold.ttf
          weight: 700

    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700

    - family: Noto Sans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700

    - family: Noto Sans Devanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
        - asset: assets/fonts/NotoSansDevanagari-Bold.ttf
          weight: 700

    - family: Noto Sans Bengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-Regular.ttf

    - family: Noto Sans Telugu
      fonts:
        - asset: assets/fonts/NotoSansTelugu-Regular.ttf
        - asset: assets/fonts/NotoSansTelugu-Bold.ttf
          weight: 700

    - family: Noto Sans Tamil
      fonts:
        - asset: assets/fonts/NotoSansTamil-Regular.ttf
        - asset: assets/fonts/NotoSansTamil-Bold.ttf
          weight: 700

