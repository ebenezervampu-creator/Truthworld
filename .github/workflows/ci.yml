name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Build, Lint, and Test
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: functions
        
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run Unit Tests
        run: npm run test:unit --if-present || npx jest --testMatch="**/tests/unit/**/*.test.ts"

      - name: Run Integration/API Tests
        run: npm run test:integration --if-present || npx jest --testMatch="**/tests/integration/**/*.test.ts"

      - name: Run Coverage
        run: npm run test:cov --if-present || npx jest --coverage

      - name: Build
        run: npm run build
