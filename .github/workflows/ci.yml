name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  security-scan:
    name: Secret & Credential Leak Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  functions-test:
    name: Cloud Functions Build, Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
        
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run Unit Tests
        run: npm run test:unit --if-present || npx jest --testMatch="**/tests/unit/**/*.test.ts"

      - name: Run Integration/API Tests
        run: npm run test:integration --if-present || npx jest --testMatch="**/tests/integration/**/*.test.ts"

      - name: Run Coverage
        run: npm run test:cov --if-present || npx jest --coverage

      - name: Build
        run: npm run build
