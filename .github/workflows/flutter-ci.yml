name: Flutter CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --set-exit-if-changed lib/ test/

      - name: Run static analysis
        run: flutter analyze --fatal-infos

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Check coverage threshold
        run: |
          if [ -f coverage/lcov.info ]; then
            # Calculate line coverage percentage
            TOTAL_LINES=$(grep -c "DA:" coverage/lcov.info || echo "0")
            HIT_LINES=$(grep "DA:" coverage/lcov.info | grep -v ",0$" | wc -l || echo "0")
            if [ "$TOTAL_LINES" -gt 0 ]; then
              COVERAGE=$(( HIT_LINES * 100 / TOTAL_LINES ))
              echo "Coverage: ${COVERAGE}%"
              # Start at 5%, ratchet up as tests are added
              if [ "$COVERAGE" -lt 5 ]; then
                echo "::error::Coverage ${COVERAGE}% is below the 5% threshold"
                exit 1
              fi
            fi
          fi

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: analyze-and-test
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web release
        run: flutter build web --release

      - name: Report bundle size
        run: |
          BUNDLE_SIZE=$(du -sh build/web/ | cut -f1)
          echo "### Web Bundle Size: ${BUNDLE_SIZE}" >> $GITHUB_STEP_SUMMARY
