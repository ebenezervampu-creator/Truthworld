<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <dir>C:/company/truthworld/functions/fonts</dir>
  <cachedir>C:/company/truthworld/functions/fonts/.cache</cachedir>

  <!-- Generic sans-serif preference order for Indian & International text -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>TruthWorld Sans</family>
      <family>Noto Sans</family>
      <family>Noto Sans Telugu</family>
      <family>Noto Sans Devanagari</family>
      <family>Noto Sans Tamil</family>
      <family>Noto Sans Bengali</family>
      <family>Roboto</family>
    </prefer>
  </alias>

  <!-- Fallback aliases for system font names -->
  <alias>
    <family>-apple-system</family>
    <prefer>
      <family>TruthWorld Sans</family>
      <family>Noto Sans</family>
      <family>Noto Sans Telugu</family>
      <family>Noto Sans Devanagari</family>
      <family>Noto Sans Tamil</family>
      <family>Noto Sans Bengali</family>
      <family>Roboto</family>
    </prefer>
  </alias>

  <alias>
    <family>BlinkMacSystemFont</family>
    <prefer>
      <family>TruthWorld Sans</family>
      <family>Noto Sans</family>
      <family>Noto Sans Telugu</family>
      <family>Noto Sans Devanagari</family>
      <family>Noto Sans Tamil</family>
      <family>Noto Sans Bengali</family>
      <family>Roboto</family>
    </prefer>
  </alias>

  <alias>
    <family>Segoe UI</family>
    <prefer>
      <family>TruthWorld Sans</family>
      <family>Noto Sans</family>
      <family>Noto Sans Telugu</family>
      <family>Noto Sans Devanagari</family>
      <family>Noto Sans Tamil</family>
      <family>Noto Sans Bengali</family>
      <family>Roboto</family>
    </prefer>
  </alias>

  <alias>
    <family>Roboto</family>
    <prefer>
      <family>Roboto</family>
      <family>TruthWorld Sans</family>
      <family>Noto Sans</family>
      <family>Noto Sans Telugu</family>
      <family>Noto Sans Devanagari</family>
      <family>Noto Sans Tamil</family>
      <family>Noto Sans Bengali</family>
    </prefer>
  </alias>
</fontconfig>
