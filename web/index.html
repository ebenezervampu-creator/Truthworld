<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <base href="/" />

  <!-- ── SEO ─────────────────────────────────────────── -->
  <title>Truthworld - Watch, Share & Create Verified Videos</title>
  <meta name="description" content="Watch family-safe videos with AI dubbing in 70+ languages & 100+ subtitles. Automated fact-checking, creator studio tools, and 100% creator revenue." />
  <meta name="keywords" content="Truthworld, Truth World, video sharing platform, watch videos, family safe content, 70 languages dubbing, 100 languages subtitles, fact checking, 100 percent creator revenue, custom channels, video studio" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://www.truthworld.in/" />

  <!-- ── Open Graph (Discord / Facebook / LinkedIn) ──── -->
  <meta property="og:type"         content="website" />
  <meta property="og:url"          content="https://www.truthworld.in/" />
  <meta property="og:site_name"    content="Truthworld" />
  <meta property="og:title"        content="Truthworld - Watch, Share & Create Verified Videos" />
  <meta property="og:description"  content="Stream family-safe, verified videos in 70+ dubbed languages & 100+ subtitles. 100% revenue share for creators on custom Truthworld channels." />
  <meta property="og:image"        content="https://www.truthworld.in/icons/og-image.png" />
  <meta property="og:image:width"  content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- ── Twitter Card ──────────────────────────────────── -->
  <meta name="twitter:card"        content="summary_large_image" />
  <meta name="twitter:site"        content="@truthworld" />
  <meta name="twitter:title"       content="Truthworld - Watch, Share & Create Verified Videos" />
  <meta name="twitter:description" content="Stream family-safe, verified videos in 70+ dubbed languages & 100+ subtitles. 100% revenue share for creators on custom Truthworld channels." />
  <meta name="twitter:image"       content="https://www.truthworld.in/icons/og-image.png" />

  <!-- ── Structured Data (JSON-LD) ────────────────────── -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebSite",
        "name": "Truthworld",
        "alternateName": ["Truth World", "Truthworld.in", "Truthworld Studio", "Truthworld Ads"],
        "url": "https://www.truthworld.in/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://www.truthworld.in/search?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      },
      {
        "@type": "Organization",
        "name": "Truthworld",
        "alternateName": ["Truth World", "Truthworld Platform"],
        "url": "https://www.truthworld.in/",
        "logo": "https://www.truthworld.in/icons/Icon-192.png",
        "sameAs": [
          "https://twitter.com/truthworld",
          "https://facebook.com/truthworld",
          "https://instagram.com/truthworld"
        ]
      },
      {
        "@type": "Brand",
        "name": "Truthworld",
        "alternateName": ["Truth World", "Truthworld Studio"],
        "url": "https://www.truthworld.in/",
        "logo": "https://www.truthworld.in/icons/Icon-192.png"
      },
      {
        "@type": "ItemList",
        "name": "Truthworld Sitelinks",
        "itemListElement": [
          {
            "@type": "SiteNavigationElement",
            "position": 1,
            "name": "Truthworld Studio",
            "description": "Manage your creator channel, upload content, track performance analytics, and engage with viewers.",
            "url": "https://www.truthworld.in/studio"
          },
          {
            "@type": "SiteNavigationElement",
            "position": 2,
            "name": "Truthworld Advertisements",
            "description": "Create, manage, and scale high-impact video advertisement campaigns on Truthworld.",
            "url": "https://www.truthworld.in/advertisements"
          },
          {
            "@type": "SiteNavigationElement",
            "position": 3,
            "name": "Truthworld Channels",
            "description": "Explore creator channels, topics, and community content on Truthworld.",
            "url": "https://www.truthworld.in/browse"
          },
          {
            "@type": "SiteNavigationElement",
            "position": 4,
            "name": "Trending & Playlists",
            "description": "Discover trending video stories, curated playlists, and top discussions on Truthworld.",
            "url": "https://www.truthworld.in/trending"
          }
        ]
      }
    ]
  }
  </script>

  <!-- ── Viewport & Theme ──────────────────────────────── -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#9B30FF" />

  <!-- ── PWA & Icons ───────────────────────────────────── -->
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="icons/Icon-192.png" />
  <link rel="manifest" href="manifest.json" />

  <!-- ── Image Cropper (Web) ──────────────────────────── -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>

  <!-- ── Preloads (cuts TTI) ───────────────────────────── -->
  <link rel="preload" href="flutter_bootstrap.js" as="script" />

  <!-- ── Fonts ─────────────────────────────────────────── -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Rounded|Material+Icons+Outlined&display=swap" rel="stylesheet">

  <!-- ── Basic CSS -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #0D0014;
      overflow: hidden;
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
    }
  </style>
</head>

<body>
  <script>
    self.FIREBASE_APPCHECK_DEBUG_TOKEN = 'aeb2d92a-1f8d-4014-819d-b24f3ffefec3';

    // Startup error fallback to prevent silent black screen
    window.addEventListener('error', function(e) {
      console.error('[Truthworld Web Boot Error]', e.error || e.message);
    });
    window.addEventListener('unhandledrejection', function(e) {
      console.error('[Truthworld Web Unhandled Rejection]', e.reason);
    });
  </script>

  <!-- Flutter bootstrap -->
  <script src="flutter_bootstrap.js"></script>
</body>
</html>
