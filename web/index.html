<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/" />
  <meta charset="UTF-8" />

  <!-- ── SEO ─────────────────────────────────────────── -->
  <title>Truthworld</title>
  <meta name="description" content="Truthworld is a premium video-sharing platform that integrates automated content validation into the publishing pipeline, ensuring trustworthy storytelling." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://www.truthworld.in/" />

  <!-- ── Open Graph (Discord / Facebook / LinkedIn) ──── -->
  <meta property="og:type"         content="website" />
  <meta property="og:url"          content="https://www.truthworld.in/" />
  <meta property="og:title"        content="Truthworld" />
  <meta property="og:description"  content="Discover verified video stories on Truthworld, the premium platform for trustworthy content creation and discovery." />
  <meta property="og:image"        content="https://www.truthworld.in/icons/og-image.png" />
  <meta property="og:image:width"  content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- ── Twitter Card ──────────────────────────────────── -->
  <meta name="twitter:card"        content="summary_large_image" />
  <meta name="twitter:title"       content="Truthworld" />
  <meta name="twitter:description" content="Discover verified video stories on Truthworld, the premium platform for trustworthy content creation and discovery." />
  <meta name="twitter:image"       content="https://www.truthworld.in/icons/og-image.png" />

  <!-- ── Structured Data (JSON-LD) ────────────────────── -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Truthworld",
    "url": "https://www.truthworld.in/",
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://www.truthworld.in/search?q={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>

  <!-- ── Viewport & Theme ──────────────────────────────── -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#9B30FF" />

  <!-- ── PWA & Icons ───────────────────────────────────── -->
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="icons/Icon-192.png" />
  <link rel="manifest" href="manifest.json" />

  <!-- ── Preloads (cuts TTI) ───────────────────────────── -->
  <link rel="preload" href="flutter_bootstrap.js" as="script" />
  <link rel="preload" href="main.dart.js" as="script" />

  <!-- ── Fonts ─────────────────────────────────────────── -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Rounded|Material+Icons+Outlined&display=swap" rel="stylesheet">

  <!-- ── Analytics (Required for Firebase Analytics on Web) ─ -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-2EV456S275"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-2EV456S275');
  </script>

  <!-- ── Override dynamic Firebase JS SDK version to a stable 10.x release ── -->
  <script>
    window.flutterfire_web_sdk_version = '10.13.0';
  </script>

</head>


<body>
  <!-- Flutter bootstrap loads directly -->
  <script src="flutter_bootstrap.js"></script>
</body>
</html>
