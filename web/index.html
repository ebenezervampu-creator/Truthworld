  <script>
    // Ensure WCAG 1.4.4 / Lighthouse Accessibility 100%: Prevent Flutter Web engine from locking viewport zoom
    (function() {
      function enforceAccessibleViewport(meta) {
        if (!meta) return;
        var content = meta.getAttribute('content') || '';
        if (content.indexOf('user-scalable=no') !== -1 || content.indexOf('maximum-scale=1.0') !== -1 || meta.hasAttribute('flt-viewport')) {
          meta.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes');
        }
      }
      var existing = document.querySelector('meta[name="viewport"]');
      if (existing) enforceAccessibleViewport(existing);
      var observer = new MutationObserver(function(mutations) {
        for (var i = 0; i < mutations.length; i++) {
          var added = mutations[i].addedNodes;
          for (var j = 0; j < added.length; j++) {
            var node = added[j];
            if (node.nodeType === 1 && node.tagName === 'META') {
              if (node.getAttribute('name') === 'viewport' || node.hasAttribute('flt-viewport')) {
                enforceAccessibleViewport(node);
              }
            }
          }
        }
      });
      observer.observe(document.head || document.documentElement, { childList: true, subtree: true });
    })();
  </script>

  <!-- ── Resilient Flutter Web Asset Fetch Interceptor ──────────────── -->
  <!-- Protects against Flutter ReleaseAssetServer & SPA 200 HTML fallbacks -->
  <!-- for missing assets (FontManifest.json, AssetManifest.bin, images). -->
  <script>
    (function() {
      var origFetch = window.fetch;
      window.fetch = function(input, init) {
        var urlStr = (typeof input === 'string') ? input : (input && input.url) ? input.url : '';
        return origFetch.apply(this, arguments).then(function(response) {
          var contentType = response.headers ? (response.headers.get('content-type') || '') : '';
          var isHtml = contentType.toLowerCase().indexOf('text/html') !== -1;
          if (isHtml) {
            // Guard FontManifest.json: return empty font manifest array so JSON parser does not throw
            if (urlStr.indexOf('FontManifest.json') !== -1) {
              console.warn('[Truthworld Asset Guard] FontManifest received HTML fallback; returning empty manifest');
              return new Response('[]', {
                status: 200,
                headers: { 'Content-Type': 'application/json' }
              });
            }
            // Guard AssetManifest: return empty manifest object
            if (urlStr.indexOf('AssetManifest.bin.json') !== -1 || urlStr.indexOf('AssetManifest.json') !== -1) {
              console.warn('[Truthworld Asset Guard] AssetManifest received HTML fallback; returning empty manifest');
              return new Response('{}', {
                status: 200,
                headers: { 'Content-Type': 'application/json' }
              });
            }
            // Convert static media/binary/font/css/js asset HTML responses to 404
            if (urlStr.indexOf('/assets/') !== -1 || urlStr.indexOf('canvaskit') !== -1 || /\.(wasm|bin|otf|ttf|woff|woff2|png|jpg|jpeg|svg|webp|ico|css|js|mjs)(\?.*)?$/i.test(urlStr)) {
              return new Response(null, {
                status: 404,
                statusText: 'Not Found'
              });
            }
          }
          return response;
        });
      };
    })();
  </script>

  <script>
    // Only enable App Check debug token on local development hosts (never in production)
    var isLocalDevHost = window.location.hostname === 'localhost' ||
                         window.location.hostname === '127.0.0.1' ||
                         window.location.hostname === '0.0.0.0' ||
                         window.location.hostname === '[::1]' ||
                         window.location.hostname.endsWith('.local');
    if (isLocalDevHost) {
      self.FIREBASE_APPCHECK_DEBUG_TOKEN = 'aeb2d92a-1f8d-4014-819d-b24f3ffefec3';
    }

    // Clean URL query parameters used for cache busting
    if (window.location.search && (window.location.search.indexOf('_v=') !== -1 || window.location.search.indexOf('_force_update=') !== -1)) {
      var cleanSearch = window.location.search
        .replace(/([?&])_v=\d+(&|$)/, '$1')
        .replace(/([?&])_force_update=\d+(&|$)/, '$1')
        .replace(/[?&]$/, '');
      var cleanUrl = window.location.pathname + cleanSearch + window.location.hash;
      window.history.replaceState({}, document.title, cleanUrl);
    }

    // Startup error fallback to prevent silent black screen
    window.addEventListener('error', function(e) {
      var errStr = (e && e.error) ? String(e.error) : ((e && e.message) ? String(e.message) : '');
      if (errStr.includes('_handledContextLostEvent') || errStr.includes('webglcontextlost')) {
        return; // Benign CanvasKit WebGL hot-restart teardown artifact
      }
      console.error('[Truthworld Web Boot Error]', e.error || e.message);
    });
    window.addEventListener('unhandledrejection', function(e) {
      var reasonStr = (e && e.reason) ? (e.reason.message || String(e.reason)) : '';
      var nameStr = (e && e.reason && e.reason.name) ? String(e.reason.name) : '';
      // Ignore benign media element interruptions / autoplay restrictions
      if (nameStr === 'AbortError' ||
          nameStr === 'NotAllowedError' ||
          reasonStr.indexOf('The play() request was interrupted') !== -1 ||
          reasonStr.indexOf('play() request was interrupted') !== -1 ||
          reasonStr.indexOf('interrupted by a call to pause()') !== -1 ||
          reasonStr.indexOf('interrupted by a new load request') !== -1 ||
          reasonStr.indexOf('removed from the document') !== -1 ||
          reasonStr.indexOf('user gesture') !== -1) {
        return;
      }
      console.error('[Truthworld Web Unhandled Rejection]', e.reason);
    });

    // Unregister legacy service workers and purge CacheStorage on local dev to prevent stale web builds
    if (isLocalDevHost) {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var registration of registrations) {
            registration.unregister();
          }
        }).catch(function(err) {
          console.warn('ServiceWorker cleanup error:', err);
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (var name of names) {
            caches.delete(name);
          }
        }).catch(function(err) {
          console.warn('CacheStorage cleanup error:', err);
        });
      }
    }

    // Evict stale topic and feed caches from GetStorage while strictly preserving user auth and preferences
    try {
      var gs = localStorage.getItem('GetStorage');
      if (gs) {
        var parsed = JSON.parse(gs);
        var modified = false;
        var staleKeys = [
          'featured_topics_cache',
          'for_you_topics_cache',
          'qualifying_categories_cache',
          'home_videos_cache',
          'feed_home',
          'feed_unexplored',
          'feed_trending',
          'feed_popular',
          'feed_new',
          'feed_flip_coin',
          'feed_music'
        ];
        for (var i = 0; i < staleKeys.length; i++) {
          var k = staleKeys[i];
          if (parsed[k] !== undefined) {
            delete parsed[k];
            modified = true;
          }
        }
        for (var key in parsed) {
          if (parsed.hasOwnProperty(key) && key.indexOf('feed_') === 0) {
            delete parsed[key];
            modified = true;
          }
        }
        if (modified) {
          localStorage.setItem('GetStorage', JSON.stringify(parsed));
        }
      }
      localStorage.removeItem('featured_topics_cache');
      localStorage.removeItem('for_you_topics_cache');
      localStorage.removeItem('qualifying_categories_cache');
      localStorage.removeItem('home_videos_cache');
    } catch (err) {
      console.warn('Local feed cache cleanup error:', err);
    }

    // ══════════════════════════════════════════════════════════════════
    // GLOBAL FORCE-UPDATER: ensures every user worldwide always runs
    // the latest deployed version — never an old cached build.
    //
    // Detection signals:
    //   • Immediate check at cold start
    //   • Page Visibility (tab switch / phone unlock)
    //   • Window focus
    //   • Network reconnect (online event)
    //   • Periodic poll every 90 seconds
    //
    // Update flow:
    //   1. Fetch version.json (no-store, cache-bust timestamp)
    //   2. Compare build signature against the one stored at boot
    //   3. On mismatch → show a gentle toast → wipe caches → reload
    // ══════════════════════════════════════════════════════════════════
    (function () {
      var BOOT_SIGNATURE = null;          // set on first successful fetch
      var RELOADING      = false;         // guard against double-reload
      var POLL_MS        = 90000;         // 90-second background poll
      var TOAST_MS       = 3000;          // toast visible before reload

      // ── Friendly update toast ──────────────────────────────────────
      function showUpdateToast(onDone) {
        var toast = document.createElement('div');
        toast.style.cssText = [
          'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);',
          'background:#1e1e2e;color:#fff;',
          'padding:12px 20px;border-radius:12px;',
          'box-shadow:0 8px 32px rgba(0,0,0,0.6);',
          'font-family:Roboto,-apple-system,sans-serif;font-size:14px;',
          'display:flex;align-items:center;gap:10px;',
          'z-index:2147483647;white-space:nowrap;',
          'animation:tw-fadein 0.25s ease;',
        ].join('');
        toast.innerHTML =
          '<span style="width:8px;height:8px;border-radius:50%;background:#9B30FF;flex-shrink:0;display:inline-block;"></span>' +
          'Updating Truthworld to the latest version\u2026';
        // inject keyframe once
        if (!document.getElementById('tw-fadein-kf')) {
          var s = document.createElement('style');
          s.id = 'tw-fadein-kf';
          s.textContent = '@keyframes tw-fadein{from{opacity:0;transform:translateX(-50%) translateY(12px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}';
          document.head.appendChild(s);
        }
        document.body.appendChild(toast);
        setTimeout(onDone, TOAST_MS);
      }

      // ── Hard reload: purge every cache layer then reload ───────────
      function hardReload() {
        if (RELOADING) return;
        RELOADING = true;

        function doReload() {
          // localStorage clear (GetStorage stale feeds already cleared above;
          // preserve auth keys by only removing tw_* cache keys)
          try {
            var toRemove = [];
            for (var i = 0; i < localStorage.length; i++) {
              var k = localStorage.key(i);
              if (k && (k.indexOf('feed_') === 0 || k.indexOf('cache_') === 0)) {
                toRemove.push(k);
              }
            }
            toRemove.forEach(function (k) { localStorage.removeItem(k); });
          } catch (_) {}

          // Wipe CacheStorage (service workers, fetch caches)
          if ('caches' in window) {
            caches.keys().then(function (names) {
              return Promise.all(names.map(function (n) { return caches.delete(n); }));
            }).then(function () {
              window.location.reload();
            }).catch(function () {
              window.location.reload();
            });
          } else {
            window.location.reload();
          }
        }

        showUpdateToast(doReload);
      }

      // ── Fetch & compare build signature ───────────────────────────
      function checkVersion() {
        fetch('/version.json?_t=' + Date.now(), {
          cache: 'no-store',
          headers: { 'Pragma': 'no-cache', 'Cache-Control': 'no-cache' }
        })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (data) {
          if (!data) return;
          var sig = (data.version || '') + '-' + (data.build_number || '');
          if (!sig || sig === '-') return;

          if (BOOT_SIGNATURE === null) {
            // First fetch at this page load — store as baseline
            BOOT_SIGNATURE = sig;
            // Also persist in sessionStorage: if user refreshes manually
            // and gets a stale HTML (shouldn't happen with no-cache headers,
            // but defense-in-depth), the next checkVersion will still detect
            // the mismatch via the persisted cross-session localStorage copy.
            try { localStorage.setItem('tw_last_build', sig); } catch (_) {}
            return;
          }

          if (sig !== BOOT_SIGNATURE) {
            console.info('[Truthworld] 🚀 New version detected: ' + sig + ' (was: ' + BOOT_SIGNATURE + ')');
            hardReload();
          }
        })
        .catch(function () {}); // silent — offline or server blip
      }

      // ── Cross-session stale-tab detection ─────────────────────────
      // Users who leave a tab open for days will be caught here:
      // on their first interaction we compare the persisted build against
      // the live version.json — even before the 90s poll fires.
      (function checkStaleSession() {
        try {
          var storedSig = localStorage.getItem('tw_last_build');
          if (!storedSig) return; // first ever visit
          fetch('/version.json?_t=' + Date.now(), { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (data) {
            if (!data) return;
            var liveSig = (data.version || '') + '-' + (data.build_number || '');
            if (liveSig && liveSig !== '-' && liveSig !== storedSig) {
              console.info('[Truthworld] 🚀 Stale session detected (' + storedSig + ' → ' + liveSig + ')');
              hardReload();
            } else if (liveSig) {
              BOOT_SIGNATURE = liveSig; // sync baseline immediately
              localStorage.setItem('tw_last_build', liveSig);
            }
          })
          .catch(function () {});
        } catch (_) {}
      })();

      // ── Bind all update-trigger signals ───────────────────────────
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') checkVersion();
      });
      window.addEventListener('focus',  checkVersion);
      window.addEventListener('online', checkVersion);   // reconnect after offline
      window.addEventListener('pageshow', function (e) {
        if (e.persisted) checkVersion(); // back/forward cache restoration
      });

      // ── Background periodic poll ───────────────────────────────────
      setInterval(checkVersion, POLL_MS);

      // ── Cold-start check immediately ──────────────────────────────
      checkVersion();
    })();

  </script>

  <!-- ─────────────────────────────────────────────────────────────────────
       Mobile Deep-Link Interceptor (YouTube-style instant native redirect)
       ─────────────────────────────────────────────────────────────────────
       On Android/iOS: detect deep-linkable paths and IMMEDIATELY redirect
       to the native app — before Flutter loads — exactly as YouTube does.
       For non-deep-link paths (home, trending, browse…): show the smart
       app banner and load Flutter normally.
       ───────────────────────────────────────────────────────────────────── -->
  <script>
    (function () {
      'use strict';

      // ── Platform detection ─────────────────────────────────────────────
      var ua = navigator.userAgent || '';
      var isAndroid = /Android/i.test(ua);
      var isIOS     = /iPhone|iPad|iPod/i.test(ua);
      if (!isAndroid && !isIOS) return; // desktop: load Flutter normally

      // ── Path analysis ─────────────────────────────────────────────────
      var pathname = window.location.pathname;   // e.g. "/@ebenezervampu"
      var search   = window.location.search;     // e.g. "?v=abc123"
      var hash     = window.location.hash;
      var fullPath = pathname + search + hash;
      var cleanPath = fullPath.replace(/^\/+/, '');

      // Paths that should bypass Flutter web and open the native app directly
      var deepLinkPrefixes = [
        '/watch', '/v/', '/shorts/',
        '/@',
        '/channel/', '/c/', '/user/',
        '/playlist/',
        '/T/', '/t/', '/topic/', '/topics/',
        '/clips/', '/clip/',
        '/chapter/', '/chapters/',
        '/post/', '/community/',
      ];

      // Also match /watch?v= (query-only) and /:vanityHandle (single segment)
      var isDeepLinkPath = (function () {
        // /watch with ?v= query param
        if (pathname === '/watch' && search.indexOf('v=') !== -1) return true;

        // Prefix-based match
        for (var i = 0; i < deepLinkPrefixes.length; i++) {
          if (pathname === deepLinkPrefixes[i].replace(/\/$/, '') ||
              pathname.indexOf(deepLinkPrefixes[i]) === 0) {
            return true;
          }
        }

        // Single-segment vanity handle: /<username> (not a reserved web route)
        var reservedRoutes = [
          '/', '/home', '/trending', '/browse', '/studio', '/search',
          '/settings', '/about', '/privacy', '/terms', '/upload', '/create',
          '/notifications', '/library', '/history', '/likedvideos',
          '/watchlater', '/subscriptions', '/advertisements', '/advertiser',
          '/ads', '/feedback', '/community-guidelines', '/copyright',
          '/analytics', '/admin', '/explore', '/login', '/signup',
        ];
        var segs = pathname.split('/').filter(Boolean);
        if (segs.length === 1) {
          var seg = '/' + segs[0];
          // Any single-segment path not in the reserved list is a vanity handle
          var isReserved = false;
          for (var j = 0; j < reservedRoutes.length; j++) {
            if (reservedRoutes[j] === seg || reservedRoutes[j] === seg + '/') {
              isReserved = true;
              break;
            }
          }
          if (!isReserved) return true;
        }

        return false;
      })();

      // ── Build deep-link intent URL ─────────────────────────────────────
      var fallbackUrl = encodeURIComponent(window.location.href);
      var intentUrl = isAndroid
        ? 'intent://www.truthworld.in/' + cleanPath +
          '#Intent;scheme=https;package=com.truthworld.app;' +
          'S.browser_fallback_url=' + fallbackUrl + ';end'
        : 'truthworld://' + cleanPath;

      // ── Smart App Banner (non-deep-link paths) ────────────────────────
      // Wire up the smart banner for pages where we load Flutter normally
      (function wireBanner() {
        var banner   = document.getElementById('tw-app-banner');
        var openBtn  = document.getElementById('tw-open-app-btn');
        var closeBtn = document.getElementById('tw-close-app-btn');

        if (banner && sessionStorage.getItem('tw_banner_dismissed') !== 'true') {
          banner.style.display = 'flex';
        }
        if (closeBtn) {
          closeBtn.addEventListener('click', function () {
            if (banner) banner.style.display = 'none';
            sessionStorage.setItem('tw_banner_dismissed', 'true');
          });
        }
        if (openBtn) {
          openBtn.setAttribute('href', intentUrl);
          openBtn.addEventListener('click', function (e) {
            e.preventDefault();
            var fp = (window.location.pathname + window.location.search + window.location.hash).replace(/^\/+/, '');
            var url = isAndroid
              ? 'intent://www.truthworld.in/' + fp +
                '#Intent;scheme=https;package=com.truthworld.app;' +
                'S.browser_fallback_url=' + encodeURIComponent(window.location.href) + ';end'
              : 'truthworld://' + fp;
            window.location.href = url;
          });
        }
      })();

      // ── Non-deep-link path on mobile: show banner, load Flutter normally
      if (!isDeepLinkPath) {
        // Also auto-dispatch for in-app browsers (WhatsApp, Telegram, Instagram, etc.)
        var isInApp = /FBAN|FBAV|Instagram|Twitter|Line|WhatsApp|Telegram|MicroMessenger/i.test(ua);
        var isExternalRef = document.referrer && !document.referrer.includes('truthworld.in');
        if ((isInApp || isExternalRef) && !sessionStorage.getItem('tw_app_launch_attempted')) {
          sessionStorage.setItem('tw_app_launch_attempted', 'true');
          setTimeout(function () { try { window.location.href = intentUrl; } catch (_) {} }, 300);
        }
        return; // load Flutter
      }

      // ════════════════════════════════════════════════════════════════════
      // DEEP-LINK PATH ON MOBILE — YouTube-style instant redirect
      // Block Flutter from loading. Show a minimal native redirect screen
      // and immediately dispatch the intent to open the native app.
      // ════════════════════════════════════════════════════════════════════

      // Prevent Flutter bootstrap script from running
      // (we cancel it by replacing the body before it appends the script tag)
      document.addEventListener('DOMContentLoaded', function () {
        // Belt-and-suspenders: cancel any Flutter bootstrap that snuck through
        var scripts = document.querySelectorAll('script[src*="flutter_bootstrap"]');
        for (var k = 0; k < scripts.length; k++) { scripts[k].remove(); }
      });

      // Replace the page body immediately with a native redirect screen
      // This runs synchronously before Flutter bootstrap, so Flutter never loads
      var storeUrl = isAndroid
        ? 'https://play.google.com/store/apps/details?id=com.truthworld.app'
        : 'https://apps.apple.com/app/truthworld/id6738912958';

      // Inject redirect UI into the body
      function renderRedirectScreen() {
        document.body.style.cssText =
          'margin:0;padding:0;background:#0D0014;font-family:Roboto,-apple-system,sans-serif;' +
          'display:flex;flex-direction:column;align-items:center;justify-content:center;' +
          'min-height:100vh;overflow:hidden;';

        document.body.innerHTML =
          '<div style="text-align:center;padding:32px 24px;max-width:360px;width:100%;">' +
            '<img src="/icons/Icon-192.png" alt="Truthworld" ' +
              'style="width:80px;height:80px;border-radius:20px;margin-bottom:24px;' +
              'box-shadow:0 8px 32px rgba(0,0,0,0.5);"' +
              'onerror="this.style.display=\'none\'">' +
            '<h1 style="color:#ffffff;font-size:22px;font-weight:700;margin:0 0 8px;">' +
              'Opening Truthworld&hellip;' +
            '</h1>' +
            '<p style="color:#a1a1aa;font-size:14px;margin:0 0 32px;line-height:1.5;">' +
              'Redirecting you to the Truthworld app.' +
            '</p>' +
            '<div id="tw-spinner" style="' +
              'width:36px;height:36px;border:3px solid rgba(255,255,255,0.15);' +
              'border-top-color:#9B30FF;border-radius:50%;' +
              'animation:tw-spin 0.8s linear infinite;margin:0 auto 32px;">' +
            '</div>' +
            '<button id="tw-open-native" ' +
              'style="display:block;width:100%;padding:14px;background:#9B30FF;' +
              'color:#ffffff;font-size:16px;font-weight:700;border:none;' +
              'border-radius:12px;cursor:pointer;margin-bottom:12px;">' +
              'Open in Truthworld App' +
            '</button>' +
            '<button id="tw-get-app" ' +
              'style="display:none;width:100%;padding:14px;background:#ffffff;' +
              'color:#000000;font-size:16px;font-weight:700;border:none;' +
              'border-radius:12px;cursor:pointer;margin-bottom:12px;">' +
              (isAndroid ? 'Get on Google Play' : 'Download on the App Store') +
            '</button>' +
            '<button id="tw-continue-web" ' +
              'style="background:none;border:none;color:#71717a;font-size:13px;' +
              'cursor:pointer;padding:8px;text-decoration:underline;">' +
              'Continue in browser' +
            '</button>' +
          '</div>' +
          '<style>@keyframes tw-spin{to{transform:rotate(360deg)}}</style>';

        // Wire up buttons
        var openNativeBtn = document.getElementById('tw-open-native');
        var getAppBtn     = document.getElementById('tw-get-app');
        var continueBtn   = document.getElementById('tw-continue-web');

        if (openNativeBtn) {
          openNativeBtn.addEventListener('click', function () {
            window.location.href = intentUrl;
          });
        }
        if (getAppBtn) {
          getAppBtn.addEventListener('click', function () {
            window.location.href = storeUrl;
          });
        }
        if (continueBtn) {
          continueBtn.addEventListener('click', function () {
            // Reload the page but skip the interceptor this time
            sessionStorage.setItem('tw_skip_redirect', '1');
            window.location.reload();
          });
        }

        // After 2.5 s without the app opening, show the "Get App" button
        var showGetApp = setTimeout(function () {
          var spinner = document.getElementById('tw-spinner');
          if (spinner) { spinner.style.display = 'none'; }
          if (getAppBtn) { getAppBtn.style.display = 'block'; }
        }, 2500);

        // Visibility change: user returned to browser → app is installed but
        // may have already handled the link. Reset spinner so page looks clean.
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible') {
            clearTimeout(showGetApp);
          }
        });
      }

      // ── Skip-redirect flag (user clicked "Continue in browser") ────────
      if (sessionStorage.getItem('tw_skip_redirect') === '1') {
        sessionStorage.removeItem('tw_skip_redirect');
        // fall through → skeleton pre-render + Flutter load
      } else {
        // ── Fire the redirect ────────────────────────────────────────────
        // Replace body immediately (synchronously) so Flutter never bootstraps
        renderRedirectScreen();

        // Dispatch intent after a tiny delay to let the browser paint the UI first
        setTimeout(function () {
          try { window.location.href = intentUrl; } catch (_) {}
        }, 50);
        return;
      }
    })();
  </script>

  <!-- ─────────────────────────────────────────────────────────────────────
       Mobile Splash Screen (Android & iOS Only)
       ─────────────────────────────────────────────────────────────────────
       Removed splash screen and entire pre-rendered UI for Desktops.
       Only mobile devices (Android & iOS) display a splash screen while
       Flutter boots.
       ───────────────────────────────────────────────────────────────────── -->
  <script>
    (function () {
      'use strict';

      // ── Platform check: Mobiles (Android, iOS) only ─────────────────────
      var ua = navigator.userAgent || '';
      var isAndroid = /Android/i.test(ua);
      var isIOS     = /iPhone|iPad|iPod/i.test(ua);
      var isMobileDevice = isAndroid || isIOS;

      // Desktops: Do NOT show splash screen or entire UI
      if (!isMobileDevice) return;

      var preLoader = document.createElement('div');
      preLoader.id = 'tw-pre-loader';
      preLoader.style.cssText = 'position:fixed;inset:0;background:#0D0014;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999998;';
      preLoader.innerHTML = '<img src="/icons/Icon-192.png" alt="Truthworld" style="width:72px;height:72px;border-radius:18px;margin-bottom:20px;box-shadow:0 8px 32px rgba(0,0,0,0.6);" onerror="this.style.display=\'none\'">' +
        '<div style="width:28px;height:28px;border:2.5px solid rgba(255,255,255,0.15);border-top-color:#ffffff;border-radius:50%;animation:tw-loader-spin 0.8s linear infinite;"></div>' +
        '<style>@keyframes tw-loader-spin{to{transform:rotate(360deg)}}</style>';
      document.body.insertBefore(preLoader, document.body.firstChild);

      function removePreElements() {
        var loader = document.getElementById('tw-pre-loader');
        if (loader) {
          loader.style.transition = 'opacity 0.2s ease';
          loader.style.opacity = '0';
          setTimeout(function () {
            var el = document.getElementById('tw-pre-loader');
            if (el && el.parentNode) { el.parentNode.removeChild(el); }
          }, 220);
        }
      }

      var observer = new MutationObserver(function (mutations) {
        for (var m = 0; m < mutations.length; m++) {
          var nodes = mutations[m].addedNodes;
          for (var n = 0; n < nodes.length; n++) {
            var node = nodes[n];
            if (node.nodeType === 1) {
              var tag = (node.tagName || '').toLowerCase();
              if (tag === 'flt-glass-pane' || tag === 'flutter-view' ||
                  tag === 'canvas' || node.id === 'flutter_target') {
                observer.disconnect();
                removePreElements();
                return;
              }
            }
          }
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });

      if (document.querySelector('flt-glass-pane, flutter-view, canvas, #flutter_target')) {
        observer.disconnect();
        removePreElements();
      }

      setTimeout(function () {
        observer.disconnect();
        removePreElements();
      }, 12000);
    })();
  </script>
